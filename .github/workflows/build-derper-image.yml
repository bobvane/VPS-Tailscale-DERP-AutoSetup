# ============================================================
# 自动构建 & 推送 Tailscale DERP 镜像到 GHCR
#
# 触发:
#   1. 定时: 每周一 03:00 (UTC) 检查 tailscale 是否有新版本
#   2. 手动: 可在 Actions 页面手动运行 (workflow_dispatch)
#
# 说明: 不随项目打 tag (v*) 触发——镜像版本号跟随 Tailscale 官方版本，
#       与项目 VERSION 解耦，避免每次 push 项目版本都白打一次镜像。
#
# 行为:
#   - 通过 GitHub API 查询 tailscale 最新版本 tag
#   - 与当前镜像已发布版本对比，有新版才构建
#   - 构建 amd64 + arm64 双架构
#   - 推送 latest + 版本号 两个标签到 ghcr.io
#
# fork 说明:
#   1. 在 fork 仓库的 Settings → Actions 开启 Actions
#   2. 首次需手动运行一次 (workflow_dispatch)
#   3. 镜像会自动构建到你 fork 的 ghcr.io/<你的用户>/<仓库>/derper
# ============================================================
name: Build DERP image

on:
  schedule:
    # 每周一 03:00 UTC 检查 tailscale 新版本
    - cron: '0 3 * * 1'
  workflow_dispatch:   # 允许手动触发
    inputs:
      version:
        description: 'Tailscale 版本号（如 v1.102.3）。留空 = 自动检测最新版'
        required: false
        type: string

env:
  # 镜像名必须全小写（Docker/GHCR 强制），仓库名含大写需转小写
  # 通过下方 lowercase-image 步骤计算（兼容 fork 仓库自动适配）
  IMAGE_BASE: ghcr.io/${{ github.repository }}/derper

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 计算小写镜像名（fork 自动适配）----------
      - name: Compute lowercase image name
        id: image
        run: |
          # 用 bash 参数展开把小写：${VAR,,} 转小写
          echo "image=$(echo "${IMAGE_BASE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "calculated image: $(echo "${IMAGE_BASE}" | tr '[:upper:]' '[:lower:]')"

      # ---------- 构建时间戳（用于镜像标签）----------
      - name: Set build timestamp
        id: build_time
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ---------- 获取 tailscale 最新版本 ----------
      # 手动触发时优先使用用户输入的版本号；否则自动查询 tailscale 最新 release
      - name: Get latest tailscale version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            latest="${{ github.event.inputs.version }}"
            echo "使用手动指定版本: ${latest}"
          else
            # 通过 GitHub API 查询 tailscale/tailscale 最新 release
            latest=$(curl -sS -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/tailscale/tailscale/releases/latest \
              | jq -r .tag_name)
            echo "自动检测 tailscale 最新版本: ${latest}"
          fi
          # 归一化：去掉前导 v（如 v1.102.3 → 1.102.3），确保标签统一
          latest="${latest#v}"
          echo "version=v${latest}" >> "$GITHUB_OUTPUT"
          echo "最终构建版本: v${latest}"

      # ---------- 判断是否需要构建 ----------
      # 对比 ghcr 上已发布的版本，避免每周重复构建同一版本
      - name: Check if build needed
        id: check
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # 手动触发时强制构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "手动触发，强制构建"
            exit 0
          fi
          NEW_VER="${{ steps.version.outputs.version }}"
          # 查询现有镜像的版本 tag（列出 ghcr 包，看是否已有该版本）
          # 通过 registry API 查询现有 tags
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" | jq -r .token)
          EXISTING=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                      "https://ghcr.io/v2/${IMAGE#ghcr.io/}/tags/list" | jq -r '.tags[]?' 2>/dev/null || true)
          echo "镜像现有 tags: ${EXISTING}"
          if echo "${EXISTING}" | grep -q "${NEW_VER}"; then
            echo "版本 ${NEW_VER} 已发布，无需重新构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到新版本 ${NEW_VER}，开始构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 构建并推送 ----------
      - name: Set up QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.build_time.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}