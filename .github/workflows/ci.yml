name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Bats Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Install bats-core (NOT legacy 'bats' apt package)
        # 注意：Ubuntu 的 apt `bats` 是旧版项目，不支持 setup_file/@test 聚合，
        # 会导致整个测试套件 gather 失败（bats-gather-tests）。必须用 bats-core。
        run: |
          BATS_VER=1.14.0
          curl -fsSL -o /tmp/bats.tar.gz \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VER}.tar.gz"
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-${BATS_VER}/install.sh /usr/local

      - name: Run shellcheck on install.sh
        run: shellcheck --severity=warning install.sh

      - name: Run bats tests
        run: bats tests/

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/derper" >> "$GITHUB_OUTPUT"
          echo "calculated image: ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/derper"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^VERSION=' install.sh | cut -d'=' -f2 | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image
        run: |
          echo "Built: ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}"

  tag-release:
    name: Sync GitHub Release Tag
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for tag compare)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare VERSION with latest git tag and sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_VER="v$(grep '^VERSION=' install.sh | cut -d'=' -f2 | tr -d '"')"
          echo "install.sh VERSION = ${NEW_VER}"
          # 取最新的 v* tag（按版本号排序）
          LATEST_TAG="$(git tag --list 'v*' | sort -V | tail -n1 || true)"
          echo "latest existing tag = ${LATEST_TAG:-<none>}"
          if [ "${NEW_VER}" = "${LATEST_TAG}" ]; then
            echo "Tag ${NEW_VER} 已存在，跳过创建"
            exit 0
          fi
          if [ -n "${LATEST_TAG}" ] && [ "$(printf '%s\n%s\n' "${LATEST_TAG}" "${NEW_VER}" | sort -V | tail -n1)" != "${NEW_VER}" ]; then
            echo "警告：新版本 ${NEW_VER} 低于已有 tag ${LATEST_TAG}，不创建（避免回退）"
            exit 0
          fi
          echo "创建 tag 与 Release: ${NEW_VER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_VER}" -m "Release ${NEW_VER}"
          git push origin "${NEW_VER}"
          gh release create "${NEW_VER}" \
            --title "DERP AutoSetup ${NEW_VER}" \
            --notes "自动同步自 main 分支（install.sh VERSION=${NEW_VER}）。" \
            || echo "Release 已存在或创建失败，忽略"
