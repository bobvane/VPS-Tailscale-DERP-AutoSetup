# ============================================================
# Tailscale DERP Docker Compose 模板
#
# 固定模板，不动态生成。所有差异通过 tderp.env 中的变量切换。
# 由 install.sh 生成最终的 docker-compose.yml（套用模板+读取 tderp.env）
#
# 证书模式通过环境变量切换（设计需求 11 & G4）:
#   DERP_CERT_MODE=manual       → 自签名（默认）
#   DERP_CERT_MODE=letsencrypt  → LE 自动证书，需开放 80 端口
#
# verify-clients 防白嫖（设计需求 G1）:
#   开启时需挂载 tailscale socket，且 VPS 装了 tailscale 客户端
# ============================================================

services:
  derper:
    image: ${DERP_IMAGE:-ghcr.io/bobvane/VPS-Tailscale-DERP-AutoSetup/derper:latest}
    container_name: derper
    restart: unless-stopped
    ports:
      - "${DERP_PORT:-12345}:${DERP_PORT:-12345}"        # DERP TCP
      - "${STUN_PORT:-3478}:${STUN_PORT:-3478}/udp"      # STUN UDP
      # 80 端口仅 LE 自动证书模式需要（HTTP-01 验证）
      # 自签名模式 DERP_HTTP_PORT=-1 时不监听，映射无害
      - "80:80"
    environment:
      - DERP_DOMAIN=${DERP_DOMAIN}
      - DERP_CERT_MODE=${DERP_CERT_MODE:-manual}
      - DERP_CERT_DIR=/app/certs
      - DERP_ADDR=:${DERP_PORT:-12345}
      - DERP_HTTP_PORT=${DERP_HTTP_PORT:-80}
      - DERP_STUN=true
      - DERP_STUN_PORT=${STUN_PORT:-3478}
      - DERP_VERIFY_CLIENTS=${DERP_VERIFY_CLIENTS:-false}
    volumes:
      - ./data/certs:/app/certs
      # 防白嫖模式时挂载 tailscale socket（默认无，注释保留）
      # - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock